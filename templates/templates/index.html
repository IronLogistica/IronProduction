{% extends "base.html" %}
{% block content %}
<div class="page-toolbar"><div class="page-title">🏭 Ordini di Produzione</div><a class="btn btn-ghost" href="/ordini-produzione/avanzamento">📊 Avanzamento</a></div>
<div class="card" style="padding:18px;margin-bottom:16px"><form id="opForm" class="op-grid">
<input name="codice_articolo" required maxlength="100" placeholder="Codice articolo *"><input name="descrizione" maxlength="300" placeholder="Descrizione">
<input name="cliente" maxlength="200" placeholder="Cliente"><input name="commessa" maxlength="100" placeholder="Commessa">
<input name="qta_pianificata" required type="number" min="0" placeholder="Quantità pianificata *"><input name="asa" required maxlength="100" value="Carpenteria Propria" placeholder="ASA *">
<label>Inizio <input name="data_inizio" type="date"></label><label>Consegna <input name="data_prevista" type="date"></label>
<label>Priorità <select name="priorita">{% for n in range(1,10) %}<option value="{{n}}" {% if n==5 %}selected{% endif %}>{{n}}</option>{% endfor %}</select></label>
<button class="btn btn-primary" type="submit">Crea OP</button></form><p id="message"></p></div>
<div class="card" style="padding:18px;overflow:auto"><table class="kanban-table"><thead><tr><th>OP / priorità</th><th>Articolo</th><th>Cliente / commessa</th><th>ASA / date</th><th>Pian. · buoni · scarto</th><th>Stato</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div>
<style>.op-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px}.op-grid input,.op-grid select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd5df;border-radius:5px}.op-grid label{font-size:12px;color:var(--text-dim)}@media(max-width:850px){.op-grid{grid-template-columns:1fr 1fr}}</style>
{% endblock %}
{% block scripts %}<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url, options={}) { const r=await fetch(url,options); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Errore'); return d; }
async function load(){try{const list=await api('/api/ordini-produzione'); rows.innerHTML=list.map(x=>`<tr><td><b>${esc(x.codice)}</b><br><small>P${x.priorita}</small></td><td>${esc(x.codice_articolo)}<br><small>${esc(x.descrizione)}</small></td><td>${esc(x.cliente)}<br><small>${esc(x.commessa)}</small></td><td>${esc(x.asa)}<br><small>${x.data_inizio||'—'} → ${x.data_prevista||'—'}</small></td><td>${x.qta_pianificata} · ${x.qta_buona} · ${x.qta_scarto}</td><td>${esc(x.stato)}</td><td>${x.stato==='Creato'?`<button class="btn btn-primary" onclick="releaseOp(${x.id})">Rilascia</button>`:x.stato==='Tecnicamente completato'?`<button class="btn btn-ghost" onclick="closeCo(${x.id})">Chiudi CO</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">Nessun ordine di produzione.</td></tr>'}catch(e){message.textContent=e.message}}
async function releaseOp(id){try{await api('/api/ordini-produzione/'+id+'/rilascia',{method:'POST'});load()}catch(e){alert(e.message)}}
async function closeCo(id){try{await api('/api/ordini-produzione/'+id+'/chiudi-co',{method:'POST'});load()}catch(e){alert(e.message)}}
opForm.onsubmit=async e=>{e.preventDefault();message.textContent='';try{const data=Object.fromEntries(new FormData(opForm));const r=await api('/api/ordini-produzione',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});message.textContent='Creato '+r.ordine.codice;opForm.reset();load()}catch(e){message.textContent='Errore: '+e.message}}; load();
</script>{% endblock %}
