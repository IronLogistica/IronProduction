{% extends "base.html" %}{% block content %}<div class="page-toolbar"><div class="page-title">🏭 Ordini di Produzione</div></div><div style="padding:18px;background:white;border-radius:8px"><form id="f"><input name="codice_articolo" placeholder="Codice articolo" required> <input name="descrizione" placeholder="Descrizione"> <input name="cliente_commessa_esterna" placeholder="Cliente / commessa"> <input name="qta_pianificata" type="number" min="0" placeholder="Q.tà"> <input name="asa" placeholder="ASA"> <button>Crea OP</button></form><p id="m"></p><table class="kanban-table"><thead><tr><th>OP</th><th>Articolo</th><th>Q.tà</th><th>Buoni/scarto</th><th>Stato</th><th></th></tr></thead><tbody id="r"></tbody></table></div>{% endblock %}{% block scripts %}<script>async function load(){let a=await (await fetch('/api/ordini-produzione')).json();r.innerHTML=a.map(x=>`<tr><td>${x.codice}</td><td>${x.codice_articolo}<br>${x.descrizione||''}</td><td>${x.qta_pianificata}</td><td>${x.qta_buona}/${x.qta_scarto}</td><td>${x.stato}</td><td>${x.stato==='Creato'?`<button onclick="release(${x.id})">Rilascia</button>`:''}</td></tr>`).join('')} async function release(id){await fetch('/api/ordini-produzione/'+id+'/rilascia',{method:'POST'});load()} f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let q=await fetch('/api/ordini-produzione',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});m.textContent=q.ok?'Ordine creato':'Errore';if(q.ok){f.reset();load()}};load()</script>{% endblock %}
