<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE Conto lavoro</title>
<style>
  :root{ --dark:#0d1b2e; --accent:#1e6fa5; --bg:#07101f; --text-dim:#6b8aaa; }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#eaf4ff}
  h1{font-size:18px;margin:0 0 4px}
  .sottotitolo{font-size:12px;color:var(--text-dim);margin-bottom:16px}
  .gruppo-cliente{margin-bottom:24px}
  .intestazione-cliente{display:flex;align-items:center;gap:10px;background:#0f2237;border-radius:8px 8px 0 0;
    padding:10px 14px;font-weight:800;font-size:14px;border-bottom:2px solid var(--accent)}
  .colonne-cliente{display:flex;gap:12px;align-items:flex-start}
  .colonne-cliente > table{flex:1;min-width:0}
  table{width:100%;border-collapse:collapse;font-size:12px;background:#0a1623;border-radius:0 0 8px 8px;overflow:hidden}
  th{background:#0f2237;color:#4d9fd6;padding:8px;text-transform:uppercase;font-size:10px;text-align:center}
  td{padding:7px 8px;border-bottom:1px solid rgba(30,111,165,.15);text-align:center;vertical-align:middle}
  .codice-cella{display:flex;align-items:center;gap:8px;text-align:left}
  .miniatura{width:64px;height:64px;cursor:zoom-in;border-radius:4px;object-fit:cover;background:#132a42;flex:none}
  .miniatura-vuota{width:64px;height:64px;border-radius:4px;background:#132a42;flex:none;display:flex;
    align-items:center;justify-content:center;color:#3d6b8f;font-size:16px}
  .codice{font-weight:800;color:#fff}
  .descr{font-size:10px;color:#9fb8d0}
  .cod-interno{font-weight:800;color:#7fd3ff;white-space:nowrap}
  .cod-interno.manca{color:#3d6b8f;font-weight:400}
  .saldo-badge{display:inline-block;min-width:34px;padding:3px 8px;border-radius:6px;border:1px solid #e0a80080;
    color:#e0a800;font-weight:800}
  .saldo-badge.completo{color:#1a9e5c;border-color:#1a9e5c80}
  .barra-avanzamento{background:#132a42;border-radius:4px;height:8px;overflow:hidden;width:100%}
  .barra-avanzamento > div{height:100%;background:#2589c7}
  .pct{font-size:10px;color:#9fb8d0;margin-top:3px}
  .codice-cella{cursor:zoom-in}
  #popup{position:fixed;inset:0;background:rgba(2,8,18,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  #popup.aperto{display:flex}
  .popup-box{flex-wrap:wrap;overflow:auto;background:#0a1623;border:2px solid var(--accent);border-radius:12px;display:flex;gap:22px;padding:20px;
    max-width:96vw;max-height:92vh;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .popup-foto{width:min(44vw,640px);height:min(80vh,760px);object-fit:contain;background:#132a42;border-radius:8px}
  .popup-foto-vuota{width:min(34vw,460px);height:min(60vh,500px);display:flex;align-items:center;justify-content:center;
    background:#132a42;border-radius:8px;font-size:90px;color:#3d6b8f}
  .popup-dati{min-width:270px;display:flex;flex-direction:column;gap:10px}
  .popup-codice{font-size:28px;font-weight:900;color:#fff;line-height:1.1}
  .popup-interno{font-size:16px;font-weight:800;color:#7fd3ff}
  .popup-descr{font-size:13px;color:#9fb8d0}
  .popup-rif{font-size:12px;color:var(--text-dim)}
  .popup-numero{display:flex;justify-content:space-between;align-items:baseline;background:#0f2237;border-radius:8px;padding:10px 14px}
  .popup-numero span{font-size:12px;text-transform:uppercase;color:#4d9fd6;font-weight:700}
  .popup-numero b{font-size:30px;color:#fff}
  .popup-numero.saldo{border:2px solid #e0a800}
  .popup-numero.saldo b{color:#e0a800}
  .popup-numero.saldo.completo{border-color:#1a9e5c}
  .popup-numero.saldo.completo b{color:#1a9e5c}
  .popup-chiudi{margin-top:auto;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:800;cursor:pointer;font-size:14px}
  tr.sospeso td{opacity:.45}
  tr.sospeso td.cella-ordine{opacity:1}
  .tag{display:inline-block;margin-top:3px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.3px}
  .tag-sospeso{background:#5a1010;color:#ff8a8a;border:1px solid #c0392b}
  .tag-revisione{background:#3d2a00;color:#ffc94d;border:1px solid #e0a800}
  .tag-anomalia{background:#5a1010;color:#fff;border:1px solid #ff4d4d;animation:lampeggia 1.4s infinite}
  @keyframes lampeggia{50%{opacity:.55}}
  #anomalie{margin-bottom:18px}
  .anomalie-box{border:2px solid #ff4d4d;border-radius:10px;background:#1a0b0f;padding:10px 14px}
  .anomalie-titolo{font-weight:900;color:#ff6b6b;font-size:15px;margin-bottom:8px}
  .anomalia{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,77,77,.25)}
  .anomalia:first-of-type{border-top:0}
  .anomalia-testo{flex:1;font-size:12px}
  .anomalia-testo b{color:#fff}
  .anomalia-motivo{font-size:14px;color:#ffd6d6;margin-top:2px}
  .anomalia-meta{font-size:11px;color:#c79a9a}
  .btn-risolto{background:#1a9e5c;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
  .popup-tempi{width:280px;display:flex;flex-direction:column;gap:6px;max-height:min(80vh,760px);overflow:auto}
  .popup-tempi-titolo{font-size:12px;text-transform:uppercase;color:#4d9fd6;font-weight:800;letter-spacing:.4px}
  .fase-riga{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0f2237;border-radius:8px;padding:8px 10px}
  .fase-nome{font-size:12px;color:#eaf4ff;font-weight:700}
  .fase-desc{font-size:10px;color:#9fb8d0}
  .fase-min{font-size:20px;font-weight:900;color:#7fd3ff;white-space:nowrap}
  .fase-min small{font-size:10px;color:#9fb8d0;font-weight:600}
  .fase-totale{border:2px solid #1e6fa5;background:#0b1d33}
  .fase-totale .fase-min{color:#fff}
  .popup-box.semplice{border:0;padding:0;background:transparent;box-shadow:none}
  .popup-sezione{background:#0f2237;border-radius:8px;padding:10px 12px;font-size:12px}
  .popup-sezione.rossa{border:1px solid #ff4d4d;background:#1a0b0f}
  .popup-sezione.gialla{border:1px solid #e0a800;background:#1d1600}
  .risolvi-box{background:#0a1623;border:2px solid #1a9e5c;border-radius:12px;padding:20px;width:min(560px,94vw)}
  .risolvi-box textarea{width:100%;min-height:110px;background:#0f2237;color:#fff;border:1px solid #1e6fa5;border-radius:8px;padding:10px;font:inherit;font-size:14px}
  .vuoto{color:var(--text-dim);font-style:italic;padding:20px;text-align:center}
</style>
</head>
<body>
<h1>🔴 LIVE Conto lavoro</h1>
<div class="sottotitolo" id="sottotitolo">Aggiornamento automatico ogni 20 secondi.</div>
<div id="anomalie"></div>
<div id="contenuto"><div class="vuoto">Caricamento…</div></div>
<div id="popup" onclick="if(event.target===this) chiudiPopup()"><div class="popup-box" id="popup-box"></div></div>

<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
{% if schema < schema_richiesto %}
document.getElementById('contenuto').innerHTML =
  '<div class="vuoto">⚠️ Tabelle del monitor LIVE non ancora create (schema conto_lavoro alla versione {{ schema }}, serve la {{ schema_richiesto }}).</div>';
{% else %}
// codice cliente -> codice interno, letto dal database di MasterWork (richiesta di Mauri, 28/11/2026)
const codiciInterni = {};
let giri = 0;
async function caricaCodiciInterni(codici){
  if(++giri % 15 === 0)   // ogni 5 minuti riprova i codici non trovati
    for(const k in codiciInterni) if(!codiciInterni[k]) delete codiciInterni[k];
  const mancanti = codici.filter(c => !(c in codiciInterni));
  if(!mancanti.length) return;
  try{
    const r = await fetch('/api/masterwork/codici-interni', {method:'POST', headers:{'Content-Type':'application/json'},
                                                             body: JSON.stringify({codici: mancanti})});
    Object.assign(codiciInterni, await r.json());
  }catch(e){}
}
// Popup: foto grande + riepilogo della riga (richiesta di Mauri, 28/11/2026)
let righeLive = [];
function srcFoto(r){
  return r.ha_foto ? `/conto-lavoro/api/articoli/${r.articolo_id}/foto` : `/api/masterwork/foto/${encodeURIComponent(r.codice)}`;
}
function apriPopup(i){
  const {g, o, r} = righeLive[i] || {};
  if(!r) return;
  const interno = codiciInterni[r.codice];
  document.getElementById('popup-box').classList.remove('semplice');
  document.getElementById('popup-box').innerHTML = `
    <img class="popup-foto" src="${srcFoto(r)}" onerror="this.outerHTML='<div class=&quot;popup-foto-vuota&quot;>📦</div>'">
    <div class="popup-tempi" id="popup-tempi">
      <div class="popup-tempi-titolo">⏱ Tempi standard per fase</div>
      <div class="popup-rif">Caricamento da MasterWork…</div>
    </div>
    <div class="popup-dati">
      <div class="popup-codice">${esc(r.codice)}</div>
      ${interno ? `<div class="popup-interno">Cod. interno: ${esc(interno)}</div>` : ''}
      <div class="popup-descr">${esc(r.descrizione)}</div>
      <div class="popup-rif">👥 ${esc(g.cliente)} · Ordine ${esc(o.numero_ordine)}${o.rif_cliente ? ' · ' + esc(o.rif_cliente) : ''}</div>
      ${o.sospeso ? `<div class="popup-sezione rossa">⏸ <b>ORDINE SOSPESO</b> — non produrre finché non viene riattivato</div>` : ''}
      ${r.revisione ? `<div class="popup-sezione gialla">🔁 <b>DA REVISIONARE</b>${r.revisione.nota ? ': ' + esc(r.revisione.nota) : ''}</div>` : ''}
      ${anomaliePerCodice(r.codice).map(a => `<div class="popup-sezione rossa">⚠️ <b>${esc(a.operaio)}</b> (${esc(dataOra(a.creato_il))}): “${esc(a.motivo)}”
          <div style="margin-top:6px"><button class="btn-risolto" onclick="apriRisolvi(${a.id})">✅ È stato risolto</button></div></div>`).join('')}
      <div class="popup-numero"><span>Q.tà ordinata</span><b>${r.quantita}</b></div>
      <div class="popup-numero"><span>Q.tà prodotta</span><b>${r.quantita_prodotta}</b></div>
      <div class="popup-numero"><span>Q.tà consegnata</span><b>${r.quantita_evasa}</b></div>
      <div class="popup-numero saldo ${r.saldo_da_produrre <= 0 ? 'completo' : ''}"><span>Saldo</span><b>${r.saldo_da_produrre}</b></div>
      <button class="popup-chiudi" onclick="chiudiPopup()">✕ Chiudi</button>
    </div>`;
  document.getElementById('popup').classList.add('aperto');
  caricaTempi(r);
}
// Tempi standard fase per fase da MasterWork (anagrafica articoli, minuti/pezzo) — Mauri, 28/11/2026
const fmtMin = m => (Math.round(m * 100) / 100).toLocaleString('it-IT');
const fmtOre = m => { const h = Math.floor(m / 60), mm = Math.round(m % 60); return h ? `${h} h ${String(mm).padStart(2,'0')}'` : `${mm}'`; };
async function caricaTempi(r){
  const box = document.getElementById('popup-tempi');
  let d;
  try{ d = await (await fetch('/api/masterwork/tempi-standard/' + encodeURIComponent(r.codice))).json(); }
  catch(e){ d = {ok:false, error:'Errore di rete'}; }
  if(!document.getElementById('popup-tempi') || box !== document.getElementById('popup-tempi')) return;
  const titolo = '<div class="popup-tempi-titolo">⏱ Tempi standard per fase</div>';
  if(!d.ok){ box.innerHTML = titolo + `<div class="popup-rif">⚠️ ${esc(d.error || 'Non disponibili')}</div>`; return; }
  if(!d.fasi.length){ box.innerHTML = titolo + '<div class="popup-rif">Nessun tempo standard in MasterWork per questo codice.</div>'; return; }
  const piuCodici = new Set(d.fasi.map(f => f.codice_interno)).size > 1;
  const saldo = Math.max(r.saldo_da_produrre || 0, 0);
  box.innerHTML = titolo + d.fasi.map(f => `
    <div class="fase-riga">
      <div><div class="fase-nome">${esc(f.fase)}${piuCodici ? ` <span class="fase-desc">(${esc(f.codice_interno)})</span>` : ''}</div>
        ${f.descrizione_fase && f.descrizione_fase !== f.fase ? `<div class="fase-desc">${esc(f.descrizione_fase)}</div>` : ''}</div>
      <div class="fase-min">${fmtMin(f.minuti)} <small>min/pz</small></div>
    </div>`).join('') + `
    <div class="fase-riga fase-totale">
      <div class="fase-nome">TOTALE per pezzo</div>
      <div class="fase-min">${fmtMin(d.totale_minuti)} <small>min/pz</small></div>
    </div>
    ${saldo > 0 ? `<div class="fase-riga fase-totale">
      <div class="fase-nome">Per il saldo<div class="fase-desc">${saldo} pz da produrre</div></div>
      <div class="fase-min">${fmtOre(d.totale_minuti * saldo)}</div>
    </div>` : ''}`;
}
function chiudiPopup(){ document.getElementById('popup').classList.remove('aperto'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') chiudiPopup(); });

// ── Anomalie segnalate dagli operai da MasterWork (richiesta di Mauri, 28/11/2026)
let ANOMALIE = [], RISOLTE = new Set(), avvisoSchema = '';
const anomaliePerCodice = c => ANOMALIE.filter(a => (a.codici || []).includes(c));
const dataOra = iso => { if(!iso) return ''; const d = new Date(iso.length <= 19 ? iso + 'Z' : iso);
  return isNaN(d) ? iso : d.toLocaleString('it-IT', {timeZone:'Europe/Rome', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); };
async function caricaAnomalie(codici){
  try{
    const rr = await fetch('/conto-lavoro/api/anomalie-risolte');
    const ris = await rr.json();
    if(Array.isArray(ris)){ RISOLTE = new Set(ris.map(x => x.mw_id)); avvisoSchema = ''; }
    else avvisoSchema = ris.error || '';
    const r = await fetch('/api/masterwork/anomalie', {method:'POST', headers:{'Content-Type':'application/json'},
                                                      body: JSON.stringify({codici})});
    const d = await r.json();
    ANOMALIE = (d.anomalie || []).filter(a => !RISOLTE.has(a.id));
  }catch(e){}
  disegnaAnomalie();
}
function anomaliaHtml(a){
  return `<div class="anomalia">
    <div class="anomalia-testo">
      <div><b>${esc((a.codici || []).join(', '))}</b> · cod. interno ${esc(a.codice_interno)}${a.fase ? ' · fase ' + esc(a.fase) : ''}</div>
      <div class="anomalia-motivo">“${esc(a.motivo)}”</div>
      <div class="anomalia-meta">👷 Segnalata da <b>${esc(a.operaio)}</b> · ${esc(dataOra(a.creato_il))}${a.azione && a.azione !== 'SEGNALAZIONE' ? ' · ' + esc(a.azione) : ''}</div>
    </div>
    <button class="btn-risolto" onclick="apriRisolvi(${a.id})">✅ È stato risolto</button>
  </div>`;
}
function disegnaAnomalie(){
  const box = document.getElementById('anomalie');
  box.innerHTML = ANOMALIE.length ? `<div class="anomalie-box">
      <div class="anomalie-titolo">⚠️ ANOMALIE SEGNALATE DAGLI OPERAI (${ANOMALIE.length})</div>
      ${avvisoSchema ? `<div class="anomalia-meta" style="margin-bottom:6px">⚠️ ${esc(avvisoSchema)}</div>` : ''}
      ${ANOMALIE.map(anomaliaHtml).join('')}</div>` : '';
}
function apriRisolvi(id){
  const a = ANOMALIE.find(x => x.id === id);
  if(!a) return;
  document.getElementById('popup-box').classList.add('semplice');
  document.getElementById('popup-box').innerHTML = `<div class="risolvi-box">
      <div class="popup-codice" style="font-size:20px">✅ Anomalia risolta</div>
      <div class="anomalia-motivo" style="margin:8px 0">“${esc(a.motivo)}”</div>
      <div class="anomalia-meta" style="margin-bottom:12px">👷 ${esc(a.operaio)} · ${esc((a.codici || []).join(', '))} · ${esc(dataOra(a.creato_il))}</div>
      <label class="popup-rif">Nota: come è stata risolta *</label>
      <textarea id="nota-risolto" placeholder="es. ripresi i tempi, aggiunta la fase di sbavatura…"></textarea>
      <div id="esito-risolto" style="color:#ff6b6b;font-size:12px;min-height:16px;margin-top:6px"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="popup-chiudi" style="background:#33475e;margin:0;flex:1" onclick="chiudiPopup()">Annulla</button>
        <button class="popup-chiudi" style="background:#1a9e5c;margin:0;flex:2" onclick="confermaRisolto(${a.id})">✅ Conferma: è stato risolto</button>
      </div></div>`;
  document.getElementById('popup').classList.add('aperto');
  setTimeout(() => document.getElementById('nota-risolto').focus(), 50);
}
async function confermaRisolto(id){
  const a = ANOMALIE.find(x => x.id === id);
  const nota = document.getElementById('nota-risolto').value.trim();
  const esito = document.getElementById('esito-risolto');
  if(!nota){ esito.textContent = 'Scrivi una nota su come è stata risolta.'; return; }
  const r = await fetch('/conto-lavoro/api/anomalie-risolte', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mw_id: id, nota, operaio: a.operaio, codice_interno: a.codice_interno,
                            motivo: a.motivo, segnalata_il: a.creato_il})});
  const d = await r.json().catch(() => ({}));
  if(!d.ok){ esito.textContent = d.error || 'Errore'; return; }
  fetch('/api/masterwork/anomalie/segna-lette', {method:'POST', headers:{'Content-Type':'application/json'},
                                                body: JSON.stringify({ids: [id]})});
  RISOLTE.add(id);
  ANOMALIE = ANOMALIE.filter(x => x.id !== id);
  chiudiPopup();
  disegnaAnomalie();
  carica();
}

async function carica(){
  let gruppi;
  try{ gruppi = await (await fetch('/conto-lavoro/api/live')).json(); }
  catch(e){ document.getElementById('contenuto').innerHTML = '<div class="vuoto">❌ Errore di rete.</div>'; return; }
  const box = document.getElementById('contenuto');
  if(Array.isArray(gruppi))
  {
    const codici = [...new Set(gruppi.flatMap(g => g.ordini.flatMap(o => o.righe.map(r => r.codice))))];
    await caricaCodiciInterni(codici);
    await caricaAnomalie(codici);
  }
  if(!Array.isArray(gruppi) || !gruppi.length){
    box.innerHTML = '<div class="vuoto">Nessun ordine confermato al momento.</div>';
    return;
  }
  const intestazione = `<tr>
      <th style="width:26%">Codice</th><th>Cod. interno</th><th>Ordine</th><th>Ordinata</th><th>Prodotta</th><th>Evasa</th><th>Saldo</th><th style="width:16%">Avanzamento</th>
    </tr>`;
  righeLive = [];
  const rigaHtml = (g, o, r) => { const i = righeLive.push({g, o, r}) - 1; return `
    <tr class="${o.sospeso ? 'sospeso' : ''}">
      <td class="codice-cella" onclick="apriPopup(${i})" title="Clicca per ingrandire">
        ${r.ha_foto
          ? `<img class="miniatura" src="/conto-lavoro/api/articoli/${r.articolo_id}/foto" loading="lazy">`
          : `<img class="miniatura" src="/api/masterwork/foto/${encodeURIComponent(r.codice)}" loading="lazy"
                 onerror="this.outerHTML='<div class=&quot;miniatura-vuota&quot;>📦</div>'">`}
        <div><div class="codice">${esc(r.codice)}</div><div class="descr">${esc(r.descrizione)}</div>
          ${r.revisione ? `<span class="tag tag-revisione" title="${esc(r.revisione.nota)}">🔁 DA REVISIONARE</span>` : ''}
          ${anomaliePerCodice(r.codice).length ? `<span class="tag tag-anomalia">⚠️ ${anomaliePerCodice(r.codice).length} ANOMALIA</span>` : ''}</div>
      </td>
      <td>${codiciInterni[r.codice]
            ? `<span class="cod-interno">${esc(codiciInterni[r.codice])}</span>`
            : `<span class="cod-interno manca">—</span>`}</td>
      <td class="cella-ordine">${esc(o.numero_ordine)}${o.rif_cliente ? `<div class="descr">${esc(o.rif_cliente)}</div>` : ''}
        ${o.sospeso ? `<span class="tag tag-sospeso">⏸ SOSPESO</span>` : ''}</td>
      <td>${r.quantita}</td>
      <td>${r.quantita_prodotta}</td>
      <td>${r.quantita_evasa}</td>
      <td><span class="saldo-badge ${r.saldo_da_produrre <= 0 ? 'completo' : ''}">${r.saldo_da_produrre}</span></td>
      <td>
        <div class="barra-avanzamento"><div style="width:${r.pct}%"></div></div>
        <div class="pct">${r.pct}%</div>
      </td>
    </tr>`; };
  const tabella = righe => `<table><thead>${intestazione}</thead><tbody>${righe.map(({g, o, r}) => rigaHtml(g, o, r)).join('')}</tbody></table>`;

  box.innerHTML = gruppi.map(g => {
    // Righe di tutti gli ordini di questo cliente, appiattite in un'unica
    // lista — con tanti codici si divide su 2 colonne affiancate così
    // entrano tutti senza scorrere troppo (richiesta di Mauri, 29/09/2026).
    const righeFlat = g.ordini.flatMap(o => o.righe.map(r => ({g, o, r})));
    const meta = Math.ceil(righeFlat.length / 2);
    const colonne = righeFlat.length > 6 ? [righeFlat.slice(0, meta), righeFlat.slice(meta)] : [righeFlat];
    return `
    <div class="gruppo-cliente">
      <div class="intestazione-cliente">👥 ${esc(g.cliente)}</div>
      <div class="colonne-cliente">${colonne.map(tabella).join('')}</div>
    </div>`;
  }).join('');
}
carica();
setInterval(carica, 20000);
{% endif %}
</script>
</body>
