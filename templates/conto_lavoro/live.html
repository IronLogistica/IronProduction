<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE Conto lavoro</title>
<style>
  :root{ --dark:#0d1b2e; --accent:#1e6fa5; --bg:#07101f; --text-dim:#6b8aaa; }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:#eaf4ff}
  h1{font-size:18px;margin:0 0 4px}
  .sottotitolo{font-size:12px;color:var(--text-dim);margin-bottom:16px}
  .gruppo-cliente{margin-bottom:24px}
  .intestazione-cliente{display:flex;align-items:center;gap:10px;background:#0f2237;border-radius:8px 8px 0 0;
    padding:10px 14px;font-weight:800;font-size:14px;border-bottom:2px solid var(--accent)}
  .colonne-cliente{display:flex;gap:12px;align-items:flex-start}
  .colonne-cliente > table{flex:1;min-width:0}
  table{width:100%;border-collapse:collapse;font-size:12px;background:#0a1623;border-radius:0 0 8px 8px;overflow:hidden}
  th{background:#0f2237;color:#4d9fd6;padding:8px;text-transform:uppercase;font-size:10px;text-align:center}
  td{padding:7px 8px;border-bottom:1px solid rgba(30,111,165,.15);text-align:center;vertical-align:middle}
  .codice-cella{display:flex;align-items:center;gap:8px;text-align:left}
  .miniatura{width:38px;height:38px;border-radius:4px;object-fit:cover;background:#132a42;flex:none}
  .miniatura-vuota{width:38px;height:38px;border-radius:4px;background:#132a42;flex:none;display:flex;
    align-items:center;justify-content:center;color:#3d6b8f;font-size:16px}
  .codice{font-weight:800;color:#fff}
  .descr{font-size:10px;color:#9fb8d0}
  .saldo-badge{display:inline-block;min-width:34px;padding:3px 8px;border-radius:6px;border:1px solid #e0a80080;
    color:#e0a800;font-weight:800}
  .saldo-badge.completo{color:#1a9e5c;border-color:#1a9e5c80}
  .barra-avanzamento{background:#132a42;border-radius:4px;height:8px;overflow:hidden;width:100%}
  .barra-avanzamento > div{height:100%;background:#2589c7}
  .pct{font-size:10px;color:#9fb8d0;margin-top:3px}
  .vuoto{color:var(--text-dim);font-style:italic;padding:20px;text-align:center}
</style>
</head>
<body>
<h1>🔴 LIVE Conto lavoro</h1>
<div class="sottotitolo" id="sottotitolo">Aggiornamento automatico ogni 20 secondi.</div>
<div id="contenuto"><div class="vuoto">Caricamento…</div></div>

<script>
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
{% if schema < schema_richiesto %}
document.getElementById('contenuto').innerHTML =
  '<div class="vuoto">⚠️ Tabelle del monitor LIVE non ancora create (schema conto_lavoro alla versione {{ schema }}, serve la {{ schema_richiesto }}).</div>';
{% else %}
async function carica(){
  let gruppi;
  try{ gruppi = await (await fetch('/conto-lavoro/api/live')).json(); }
  catch(e){ document.getElementById('contenuto').innerHTML = '<div class="vuoto">❌ Errore di rete.</div>'; return; }
  const box = document.getElementById('contenuto');
  if(!Array.isArray(gruppi) || !gruppi.length){
    box.innerHTML = '<div class="vuoto">Nessun ordine confermato al momento.</div>';
    return;
  }
  const intestazione = `<tr>
      <th style="width:26%">Codice</th><th>Ordine</th><th>Ordinata</th><th>Prodotta</th><th>Evasa</th><th>Saldo</th><th style="width:16%">Avanzamento</th>
    </tr>`;
  const rigaHtml = (o, r) => `
    <tr>
      <td class="codice-cella">
        ${r.ha_foto
          ? `<img class="miniatura" src="/conto-lavoro/api/articoli/${r.articolo_id}/foto" loading="lazy">`
          : `<div class="miniatura-vuota">📦</div>`}
        <div><div class="codice">${esc(r.codice)}</div><div class="descr">${esc(r.descrizione)}</div></div>
      </td>
      <td>${esc(o.numero_ordine)}${o.rif_cliente ? `<div class="descr">${esc(o.rif_cliente)}</div>` : ''}</td>
      <td>${r.quantita}</td>
      <td>${r.quantita_prodotta}</td>
      <td>${r.quantita_evasa}</td>
      <td><span class="saldo-badge ${r.saldo_da_produrre <= 0 ? 'completo' : ''}">${r.saldo_da_produrre}</span></td>
      <td>
        <div class="barra-avanzamento"><div style="width:${r.pct}%"></div></div>
        <div class="pct">${r.pct}%</div>
      </td>
    </tr>`;
  const tabella = righe => `<table><thead>${intestazione}</thead><tbody>${righe.map(({o, r}) => rigaHtml(o, r)).join('')}</tbody></table>`;

  box.innerHTML = gruppi.map(g => {
    // Righe di tutti gli ordini di questo cliente, appiattite in un'unica
    // lista — con tanti codici si divide su 2 colonne affiancate così
    // entrano tutti senza scorrere troppo (richiesta di Mauri, 29/09/2026).
    const righeFlat = g.ordini.flatMap(o => o.righe.map(r => ({o, r})));
    const meta = Math.ceil(righeFlat.length / 2);
    const colonne = righeFlat.length > 6 ? [righeFlat.slice(0, meta), righeFlat.slice(meta)] : [righeFlat];
    return `
    <div class="gruppo-cliente">
      <div class="intestazione-cliente">👥 ${esc(g.cliente)}</div>
      <div class="colonne-cliente">${colonne.map(tabella).join('')}</div>
    </div>`;
  }).join('');
}
carica();
setInterval(carica, 20000);
{% endif %}
</script>
</body>
</html>
